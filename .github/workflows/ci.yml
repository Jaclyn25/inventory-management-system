name: Validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stockroom
          POSTGRES_DB: stockroom
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U stockroom" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INVENTORY_TEST_CONNECTION: Host=localhost;Database=stockroom;Username=stockroom
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=backend.trx" --results-directory TestResults
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: backend-evidence
          path: TestResults/
          retention-days: 14
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run lint
      - run: npm test -- --reporter=default --reporter=junit --outputFile.junit=test-results/frontend.xml
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: frontend-evidence
          path: frontend/test-results/frontend.xml
          retention-days: 14
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stockroom
          POSTGRES_DB: stockroom_e2e
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U stockroom -d stockroom_e2e" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ConnectionStrings__Inventory: Host=localhost;Database=stockroom_e2e;Username=stockroom
      Database__Migrate: 'true'
      Database__Seed: 'true'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: dotnet build -c Release
      - name: Start API and wait for readiness
        shell: bash
        run: |
          dotnet run --project backend/Stockroom.Api -c Release --no-build --no-launch-profile --urls http://127.0.0.1:5081 > api.log 2>&1 &
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:5081/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat api.log
          exit 1
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: browser-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
            api.log
          retention-days: 14
