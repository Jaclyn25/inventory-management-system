name: stockroom
services:
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ['127.0.0.1:${INVENTORY_WEB_PORT:-18081}:80']
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/api/health']
      interval: 5s
      timeout: 5s
      retries: 15
  api:
    build:
      context: .
      dockerfile: backend/Stockroom.Api/Dockerfile
    env_file: .env
    environment:
      Database__Host: db
      Database__Port: '5432'
      Database__Migrate: 'true'
      Database__Seed: ${INVENTORY_SEED:-true}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "bash -c ': > /dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockroom}
      POSTGRES_USER: ${POSTGRES_USER:-stockroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports: ['127.0.0.1:54330:5432']
    volumes: [stockroom-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  stockroom-data:
